<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<title>Marque de Coinche</title>
	<link rel="canonical" href="https://sambutcher.github.io/MarqueCoinche/">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Marque des points à la coinche, utilisable hors connexion.">

	<!-- Application installée (écran d'accueil) -->
	<link rel="manifest" href="manifest.json">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Marque Coinche">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
	<meta name="format-detection" content="telephone=no">

	<!-- Icônes -->
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="mask-icon" href="safari-pinned-tab.svg" color="#c62828">

	<link rel="stylesheet" href="style.css">
	<script type="module" src="js/main.js"></script>
</head>

<body>
	<main class="app">

		<!-- Marque -->
		<section class="marque" aria-label="Score">
			<div class="marque-equipe">
				<h2>Nous</h2>
				<ol class="manches" id="manches-nous"></ol>
				<p class="score" id="score-nous">0</p>
				<p class="etoiles" id="etoiles-nous"></p>
			</div>
			<div class="marque-equipe">
				<h2>Eux</h2>
				<ol class="manches" id="manches-eux"></ol>
				<p class="score" id="score-eux">0</p>
				<p class="etoiles" id="etoiles-eux"></p>
			</div>
		</section>

		<!-- Phase 1 : annonce -->
		<section class="carte" id="phase-annonce" aria-label="Annonce">
			<h3>Donneur</h3>
			<div class="tapis" role="radiogroup" aria-label="Donneur" id="donneurs">
				<button type="button" class="place place-0" data-donneur="0" aria-label="Donneur à gauche">←</button>
				<button type="button" class="place place-1" data-donneur="1" aria-label="Donneur en face">↑</button>
				<button type="button" class="place place-2" data-donneur="2" aria-label="Donneur à droite">→</button>
				<button type="button" class="place place-3" data-donneur="3" aria-label="Donneur en bas">↓</button>
				<div class="tapis-centre" aria-hidden="true"></div>
			</div>

			<h3>Contrat</h3>
			<div class="grille-contrats" role="radiogroup" aria-label="Contrat" id="contrats"></div>

			<div class="segmente" role="radiogroup" aria-label="Coinche" id="coinches"></div>

			<div class="paire">
				<button type="button" class="bouton bouton-principal" data-preneur="nous" disabled>Nous prenons</button>
				<button type="button" class="bouton bouton-principal" data-preneur="eux" disabled>Eux prennent</button>
			</div>
		</section>

		<!-- Phase 2 : résultat -->
		<section class="carte" id="phase-resultat" aria-label="Résultat" hidden>
			<p class="recap" id="recap"></p>

			<button type="button" class="bouton bouton-etoile" id="etoile" aria-pressed="false">★ Étoile</button>

			<div class="paire">
				<button type="button" class="bouton bouton-faite" data-resultat="faite">Faite</button>
				<button type="button" class="bouton bouton-chutee" data-resultat="chutee">Chutée</button>
			</div>
			<button type="button" class="bouton bouton-contour" data-resultat="annulee">Annulée</button>
			<button type="button" class="bouton bouton-lien" id="modifier">Modifier l'annonce</button>
		</section>

		<!-- Outils -->
		<section class="outils">
			<div class="paire">
				<button type="button" class="bouton bouton-contour" id="annuler-donne">↶ Annuler la donne</button>
				<button type="button" class="bouton bouton-contour bouton-danger" id="nouvelle-partie">Nouvelle partie</button>
			</div>
			<label class="interrupteur" id="option-ecran" hidden>
				<span>Garder l'écran allumé</span>
				<input type="checkbox" id="ecran-allume" role="switch">
			</label>
		</section>

		<details class="carte historique" id="historique">
			<summary>Historique</summary>
			<ol id="liste-donnes" reversed></ol>
		</details>

	</main>
</body>

</html>
