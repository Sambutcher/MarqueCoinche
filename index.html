<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<title>Marque de Coinche</title>
	<link rel="canonical" href="https://sambutcher.github.io/MarqueCoinche/">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="description" content="Marque des points à la coinche, utilisable hors connexion.">

	<!-- Application installée (écran d'accueil) -->
	<link rel="manifest" href="manifest.json">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Marque Coinche">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
	<meta name="format-detection" content="telephone=no">

	<!-- Icônes -->
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="mask-icon" href="safari-pinned-tab.svg" color="#c62828">

	<link rel="stylesheet" href="style.css">
	<script type="module" src="js/main.js"></script>
</head>

<body>
	<main class="app">

		<!-- Accueil -->
		<div class="ecran" id="ecran-accueil">
			<h1 class="titre">Marque de Coinche</h1>
			<section class="carte menu">
				<button type="button" class="bouton bouton-principal" id="accueil-nouvelle">Nouvelle partie</button>
				<button type="button" class="bouton bouton-contour" id="accueil-reprendre">Reprendre la partie</button>
			</section>
			<form class="carte recherche" id="form-scores">
				<label for="numero-table">Scores d'une autre table</label>
				<div class="pile">
					<input type="text" id="numero-table" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
						autocomplete="off" placeholder="N° de table" required>
					<button type="submit" class="bouton bouton-contour">Afficher les scores</button>
				</div>
				<p class="message" id="message-accueil" role="status"></p>
			</form>
		</div>

		<!-- Joueurs autour de la table -->
		<div class="ecran" id="ecran-table" hidden>
			<h1 class="titre" id="titre-table"></h1>
			<form class="carte" id="form-table">
				<div class="table-jeu">
					<input type="text" class="joueur joueur-nous place-haut" data-place="1" maxlength="3"
						aria-label="Joueur en haut (Nous)" autocomplete="off" autocapitalize="characters" spellcheck="false">
					<input type="text" class="joueur joueur-eux place-gauche" data-place="0" maxlength="3"
						aria-label="Joueur à gauche (Eux)" autocomplete="off" autocapitalize="characters" spellcheck="false">
					<div class="plateau" aria-hidden="true"></div>
					<input type="text" class="joueur joueur-eux place-droite" data-place="2" maxlength="3"
						aria-label="Joueur à droite (Eux)" autocomplete="off" autocapitalize="characters" spellcheck="false">
					<input type="text" class="joueur joueur-nous place-bas" data-place="3" maxlength="3"
						aria-label="Joueur en bas (Nous)" autocomplete="off" autocapitalize="characters" spellcheck="false">
				</div>
				<div class="paire">
					<button type="button" class="bouton bouton-contour" id="table-retour">Retour</button>
					<button type="submit" class="bouton bouton-principal">Commencer</button>
				</div>
			</form>
		</div>

		<!-- Scores d'une autre table -->
		<div class="ecran" id="ecran-scores" hidden>
			<h1 class="titre" id="titre-scores"></h1>
			<p class="message" id="message-scores" role="status"></p>
			<div id="resultat-scores" hidden>

				<!-- Marque (lecture seule) -->
				<section class="marque" aria-label="Score">
					<div class="marque-equipe">
						<h2 id="lect-titre-nous">Nous</h2>
						<ol class="manches" id="lect-manches-nous"></ol>
						<p class="score" id="lect-score-nous">0</p>
						<p class="etoiles" id="lect-etoiles-nous"></p>
					</div>
					<div class="marque-equipe">
						<h2 id="lect-titre-eux">Eux</h2>
						<ol class="manches" id="lect-manches-eux"></ol>
						<p class="score" id="lect-score-eux">0</p>
						<p class="etoiles" id="lect-etoiles-eux"></p>
					</div>
				</section>

				<p class="carte contrat-en-cours">
					<small>Contrat en cours</small>
					<strong id="lect-contrat"></strong>
				</p>
			</div>
			<button type="button" class="bouton bouton-contour" id="scores-retour">Retour à l'accueil</button>
		</div>

		<!-- QR Code de la table -->
		<dialog class="dialogue-qr" id="dialogue-qr" aria-labelledby="qr-titre">
			<h2 id="qr-titre">Suivre les scores</h2>
			<div class="qr" id="qr-image" role="img" aria-label="QR Code de la table"></div>
			<p class="message" id="qr-texte">Scannez ce code avec un autre téléphone pour afficher les scores en direct.</p>
			<button type="button" class="bouton bouton-contour" id="qr-fermer">Fermer</button>
		</dialog>

		<!-- Partie -->
		<div class="ecran" id="ecran-partie" hidden>
			<button type="button" class="table-numero" id="table-numero" aria-haspopup="dialog"></button>

			<!-- Marque -->
			<section class="marque" aria-label="Score">
				<div class="marque-equipe">
					<h2 id="titre-nous">Nous</h2>
					<ol class="manches" id="manches-nous"></ol>
					<p class="score" id="score-nous">0</p>
					<p class="etoiles" id="etoiles-nous"></p>
				</div>
				<div class="marque-equipe">
					<h2 id="titre-eux">Eux</h2>
					<ol class="manches" id="manches-eux"></ol>
					<p class="score" id="score-eux">0</p>
					<p class="etoiles" id="etoiles-eux"></p>
				</div>
			</section>

			<!-- Phase 1 : annonce -->
			<div class="phase" id="phase-annonce">
				<section class="carte carte-donneur donneur" role="radiogroup" aria-labelledby="titre-donneur" id="donneurs">
					<h3 id="titre-donneur">Donneur</h3>
					<button type="button" class="place" data-donneur="0" role="radio" aria-label="Donneur à gauche">←</button>
					<button type="button" class="place" data-donneur="1" role="radio" aria-label="Donneur en face">↑</button>
					<button type="button" class="place" data-donneur="2" role="radio" aria-label="Donneur à droite">→</button>
					<button type="button" class="place" data-donneur="3" role="radio" aria-label="Donneur en bas">↓</button>
				</section>

				<section class="carte" aria-label="Contrat">
					<div class="grille-contrats" role="radiogroup" aria-label="Contrat" id="contrats"></div>

					<div class="grille-couleurs" role="radiogroup" aria-label="Couleur d'atout" id="couleurs"></div>

					<div class="segmente" role="radiogroup" aria-label="Coinche" id="coinches"></div>
				</section>

				<section class="carte carte-donneur donneur" aria-labelledby="titre-preneur" id="preneurs">
					<h3 id="titre-preneur">Preneur</h3>
					<button type="button" class="place" data-joueur="0" aria-label="Preneur à gauche" disabled>←</button>
					<button type="button" class="place" data-joueur="1" aria-label="Preneur en face" disabled>↑</button>
					<button type="button" class="place" data-joueur="2" aria-label="Preneur à droite" disabled>→</button>
					<button type="button" class="place" data-joueur="3" aria-label="Preneur en bas" disabled>↓</button>
				</section>
			</div>

			<!-- Phase 2 : résultat -->
			<section class="carte" id="phase-resultat" aria-label="Résultat" hidden>
				<p class="recap" id="recap"></p>

				<button type="button" class="bouton bouton-etoile" id="etoile" aria-pressed="false">★ Étoile</button>

				<div class="paire">
					<button type="button" class="bouton bouton-faite" data-resultat="faite">Faite</button>
					<button type="button" class="bouton bouton-chutee" data-resultat="chutee">Chutée</button>
				</div>
				<button type="button" class="bouton bouton-contour" data-resultat="annulee">Annulée</button>
				<button type="button" class="bouton bouton-lien" id="modifier">Modifier l'annonce</button>
			</section>

			<!-- Outils -->
			<section class="outils">
				<div class="paire">
					<button type="button" class="bouton bouton-contour" id="annuler-donne">↶ Annuler la donne</button>
					<button type="button" class="bouton bouton-contour" id="retour-accueil">Accueil</button>
				</div>
			</section>

			<details class="carte historique" id="historique">
				<summary>Historique</summary>
				<ol id="liste-donnes" reversed></ol>
			</details>
		</div>
	</main>
</body>

</html>
